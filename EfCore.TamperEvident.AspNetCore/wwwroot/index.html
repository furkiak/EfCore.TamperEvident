<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <base href="{{BASE}}">
  <title>{{TITLE}}</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/dashboard.css?v={{VERSION}}">
</head>
<body>
  <!-- The "wallpaper" gives the glass something to refract. -->
  <div class="wallpaper" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.2c0 4.9-3.1 8.4-7.5 9.8-4.4-1.4-7.5-4.9-7.5-9.8V6L12 3z"/></symbol>
      <symbol id="i-shield-check" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.2c0 4.9-3.1 8.4-7.5 9.8-4.4-1.4-7.5-4.9-7.5-9.8V6L12 3z"/><path d="M8.6 12.2l2.4 2.4 4.5-4.7"/></symbol>
      <symbol id="i-shield-alert" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.2c0 4.9-3.1 8.4-7.5 9.8-4.4-1.4-7.5-4.9-7.5-9.8V6L12 3z"/><path d="M12 8.2v4.4M12 15.9v.1"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.7" cy="6.5" r=".6"/><circle cx="4.7" cy="12" r=".6"/><circle cx="4.7" cy="17.5" r=".6"/></symbol>
      <symbol id="i-verify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.4 12.2l2.6 2.6 4.7-5"/></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.7l4.5 4.6 4.5-4.6M5 19.5h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.6 15.6L20 20"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.2 13.8a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M13.8 10.2a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-table" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 10h16M10 10v9"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.6" r="3.6"/><path d="M5 19.5c.7-3.4 3.5-5.2 7-5.2s6.3 1.8 7 5.2"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8.2" cy="14.8" r="3.7"/><path d="M10.9 12.1L19 4M15.6 7.4l2.4 2.4M13.4 9.6l1.8 1.8"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5v-1.2A2.3 2.3 0 0 0 13.2 5H6.8A2.3 2.3 0 0 0 4.5 7.3v6.4a2.3 2.3 0 0 0 2.3 2.3h1.7"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8 8 0 1 1 9.8 4a6.4 6.4 0 0 0 10.2 10.2z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 0 1-12.9 5.2M4.5 12a7.5 7.5 0 0 1 12.9-5.2"/><path d="M17.8 3.5v3.8h-3.8M6.2 20.5v-3.8h3.8"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
      <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h15.5M4 15h15.5"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h6.6L19 8.9V18a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 18V6A2.5 2.5 0 0 1 7 3.5z"/><path d="M13.5 3.8V9H19M8.5 13h7M8.5 16.5h5"/></symbol>
      <symbol id="i-braces" viewBox="0 0 24 24"><path d="M9 4.5C7 4.5 6.5 5.5 6.5 7v2c0 1.2-.6 2.2-2 3 1.4.8 2 1.8 2 3v2c0 1.5.5 2.5 2.5 2.5M15 4.5c2 0 2.5 1 2.5 2.5v2c0 1.2.6 2.2 2 3-1.4.8-2 1.8-2 3v2c0 1.5-.5 2.5-2.5 2.5"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.2L3.4 19h17.2L12 4.2z"/><path d="M12 10v4M12 16.6v.1"/></symbol>
      <symbol id="i-anchor" viewBox="0 0 24 24"><circle cx="12" cy="5.7" r="2.2"/><path d="M12 8v12.5M7 12.5h10M4.5 14.5c.4 3.4 3.5 6 7.5 6s7.1-2.6 7.5-6"/></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M9.5 5v14"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar glass" aria-label="Navigation">
      <a class="brand" href="#/overview" aria-label="Overview">
        <span class="brand-mark"><svg class="ic"><use href="#i-shield-check"/></svg></span>
        <span class="brand-text"><strong id="brand-title">{{TITLE}}</strong><small>Audit trail</small></span>
      </a>

      <nav class="nav" aria-label="Sections">
        <a class="nav-item" data-route="overview" href="#/overview"><svg class="ic"><use href="#i-grid"/></svg><span>Overview</span></a>
        <a class="nav-item" data-route="trail" href="#/trail"><svg class="ic"><use href="#i-list"/></svg><span>Audit trail</span></a>
        <a class="nav-item" data-route="verify" href="#/verify"><svg class="ic"><use href="#i-verify"/></svg><span>Verify</span></a>
        <a class="nav-item" data-route="export" href="#/export" id="nav-export"><svg class="ic"><use href="#i-export"/></svg><span>Export</span></a>
      </nav>

      <div class="side-section">
        <h2>Tables</h2>
        <div class="table-list" id="side-tables" role="list"></div>
      </div>

      <div class="side-foot">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch appearance" title="Switch appearance"><svg class="ic"><use href="#i-moon"/></svg></button>
        <span class="version">v{{VERSION}}</span>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="toolbar glass">
        <h1 id="page-title">Overview</h1>
        <label class="search" aria-label="Search the audit trail">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search record, user or hash" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </label>
        <button class="btn primary" id="verify-all" type="button"><svg class="ic"><use href="#i-verify"/></svg><span>Verify now</span></button>
      </header>

      <div class="view" id="view" aria-live="polite"></div>
    </main>
  </div>

  <aside class="drawer glass" id="drawer" aria-hidden="true" aria-label="Entry details" tabindex="-1"></aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">The audit dashboard needs JavaScript.</p></noscript>
  <script src="assets/dashboard.js?v={{VERSION}}" defer></script>
</body>
</html>
